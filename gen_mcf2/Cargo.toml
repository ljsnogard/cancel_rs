[package]
name = "gen_mcf2"
version = "0.2.0"
edition = "2024"

authors = ["lino <lino_snsalias@outlook.com>"]
repository = "https://github.com/ljsnogard/cancel_rs"
keywords = ["async"]
categories = ["no-std"]
license = "MIT/Apache-2.0"
description = """
A macro working with crate `abs_cancel` v0.2 to generate codes and types needed to implement `Future`
and `TrMayCancel` for a pattern that supports graceful cancellation in async programming.
"""

[lib]
proc-macro = true

[dependencies]
zyn = "0.5.4"
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
abs_cancel = { path = "../abs_cancel-rs" }
compio = { version = "0.19", features = ["macros"] }

[[test]]
name = "compio_runtime"
path = "tests_/compio_.rs"
